<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    html, body { margin: 0; padding: 0; overflow: hidden; background: transparent; font-family: system-ui, -apple-system, sans-serif; user-select: none; }
    #wrap { position: relative; display: block; line-height: 0; border-radius: 6px; overflow: hidden; }
    canvas { display: block; width: 100%; touch-action: none; }
    #hint {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      color: #6b7280;
      padding: 4px 4px 2px;
      line-height: 1.3;
    }
    #hint .kbd {
      background: rgba(128, 128, 128, 0.15);
      border-radius: 3px;
      padding: 1px 5px;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div id="wrap"><canvas id="cv"></canvas></div>
  <div id="hint">
    <span>💡 <b>Drag inside</b> to move • <b>Drag handles</b> to resize • <b>Drag outside</b> to redraw</span>
    <span id="badge-info" class="kbd">Ready</span>
  </div>
  <script>
    function sendMessage(type, data) {
      const out = Object.assign({ isStreamlitMessage: true, type: type }, data || {});
      window.parent.postMessage(out, "*");
    }
    function setFrameHeight(height) {
      sendMessage("streamlit:setFrameHeight", { height: height });
    }
    function setComponentValue(value) {
      sendMessage("streamlit:setComponentValue", { value: value });
    }

    const canvas = document.getElementById("cv");
    const ctx = canvas.getContext("2d");
    const badgeInfo = document.getElementById("badge-info");
    const img = new Image();
    let color = "#1976d2";
    let box = null; // [l, t, r, b]
    let drag = null;
    let lastSrc = "";
    const HIT_RADIUS = 14;

    function toCanvasXY(event) {
      const r = canvas.getBoundingClientRect();
      const x = ((event.clientX - r.left) / r.width) * canvas.width;
      const y = ((event.clientY - r.top) / r.height) * canvas.height;
      return {
        x: Math.max(0, Math.min(canvas.width, x)),
        y: Math.max(0, Math.min(canvas.height, y)),
      };
    }

    function normBox(b) {
      if (!b) return null;
      return [
        Math.min(b[0], b[2]),
        Math.min(b[1], b[3]),
        Math.max(b[0], b[2]),
        Math.max(b[1], b[3])
      ];
    }

    function getHandles(b) {
      if (!b) return {};
      const [l, t, r, bot] = b;
      const mx = (l + r) / 2;
      const my = (t + bot) / 2;
      return {
        nw: { x: l, y: t, cursor: "nwse-resize" },
        ne: { x: r, y: t, cursor: "nesw-resize" },
        se: { x: r, y: bot, cursor: "nwse-resize" },
        sw: { x: l, y: bot, cursor: "nesw-resize" },
        n:  { x: mx, y: t, cursor: "ns-resize" },
        s:  { x: mx, y: bot, cursor: "ns-resize" },
        w:  { x: l, y: my, cursor: "ew-resize" },
        e:  { x: r, y: my, cursor: "ew-resize" }
      };
    }

    function hitTest(p) {
      if (!box) return { type: "outside" };
      const nb = normBox(box);
      const [l, t, r, bot] = nb;
      const handles = getHandles(nb);

      // Check corner and edge handles
      for (const k of ["nw", "ne", "se", "sw", "n", "s", "w", "e"]) {
        const h = handles[k];
        const dx = p.x - h.x;
        const dy = p.y - h.y;
        if (Math.hypot(dx, dy) <= HIT_RADIUS) {
          return { type: "handle", handle: k, cursor: h.cursor };
        }
      }

      // Check inside
      if (p.x >= l && p.x <= r && p.y >= t && p.y <= bot) {
        return { type: "inside", cursor: "move" };
      }

      return { type: "outside", cursor: "crosshair" };
    }

    function updateBadge() {
      if (!box) {
        badgeInfo.textContent = "No selection";
        return;
      }
      const nb = normBox(box);
      const w = Math.round(nb[2] - nb[0]);
      const h = Math.round(nb[3] - nb[1]);
      badgeInfo.textContent = `${w} × ${h} px`;
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      if (img.complete && img.naturalWidth) {
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      }
      if (!box) return;

      const [l, t, r, bot] = normBox(box);
      const w = r - l;
      const h = bot - t;

      // Semi-transparent dark overlay outside crop box
      ctx.fillStyle = "rgba(0, 0, 0, 0.42)";
      ctx.fillRect(0, 0, canvas.width, t);
      ctx.fillRect(0, bot, canvas.width, canvas.height - bot);
      ctx.fillRect(0, t, l, h);
      ctx.fillRect(r, t, canvas.width - r, h);

      // Crop box outline
      ctx.save();
      ctx.strokeStyle = "rgba(255, 255, 255, 0.7)";
      ctx.lineWidth = Math.max(3, Math.round(canvas.width / 240));
      ctx.strokeRect(l, t, w, h);

      ctx.strokeStyle = color;
      ctx.lineWidth = Math.max(2, Math.round(canvas.width / 320));
      ctx.strokeRect(l, t, w, h);

      // Subtle rule-of-thirds grid
      ctx.strokeStyle = "rgba(255, 255, 255, 0.25)";
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(l + w / 3, t); ctx.lineTo(l + w / 3, bot);
      ctx.moveTo(l + 2 * w / 3, t); ctx.lineTo(l + 2 * w / 3, bot);
      ctx.moveTo(l, t + h / 3); ctx.lineTo(r, t + h / 3);
      ctx.moveTo(l, t + 2 * h / 3); ctx.lineTo(r, t + 2 * h / 3);
      ctx.stroke();

      // Handles
      const handles = getHandles([l, t, r, bot]);
      const hs = Math.max(7, Math.round(canvas.width / 90));
      const hsHalf = hs / 2;

      for (const k of ["nw", "ne", "se", "sw", "n", "s", "w", "e"]) {
        const hpt = handles[k];
        ctx.fillStyle = "#ffffff";
        ctx.strokeStyle = color;
        ctx.lineWidth = 2;
        ctx.fillRect(hpt.x - hsHalf, hpt.y - hsHalf, hs, hs);
        ctx.strokeRect(hpt.x - hsHalf, hpt.y - hsHalf, hs, hs);
      }

      // Small size tag above box
      const tagText = `${Math.round(w)} × ${Math.round(h)}`;
      ctx.font = "bold 11px system-ui, sans-serif";
      const tagW = ctx.measureText(tagText).width + 10;
      const tagH = 18;
      let tagY = t - tagH - 4;
      if (tagY < 2) tagY = t + 4;
      let tagX = Math.max(2, Math.min(canvas.width - tagW - 2, l));

      ctx.fillStyle = "rgba(18, 20, 24, 0.85)";
      ctx.beginPath();
      if (ctx.roundRect) {
        ctx.roundRect(tagX, tagY, tagW, tagH, 3);
      } else {
        ctx.rect(tagX, tagY, tagW, tagH);
      }
      ctx.fill();

      ctx.fillStyle = "#ffffff";
      ctx.fillText(tagText, tagX + 5, tagY + 13);

      ctx.restore();
      updateBadge();
    }

    function onPointerDown(event) {
      event.preventDefault();
      canvas.setPointerCapture(event.pointerId);
      const p = toCanvasXY(event);
      const hit = hitTest(p);

      if (hit.type === "handle") {
        drag = {
          mode: "resize",
          handle: hit.handle,
          origin: p,
          initBox: normBox(box)
        };
      } else if (hit.type === "inside") {
        drag = {
          mode: "move",
          origin: p,
          initBox: normBox(box)
        };
      } else {
        drag = {
          mode: "draw",
          origin: p,
          initBox: [p.x, p.y, p.x, p.y]
        };
        box = [p.x, p.y, p.x, p.y];
      }
      draw();
    }

    function onPointerMove(event) {
      const p = toCanvasXY(event);
      if (!drag) {
        const hit = hitTest(p);
        canvas.style.cursor = hit.cursor || "crosshair";
        return;
      }
      event.preventDefault();
      const dx = p.x - drag.origin.x;
      const dy = p.y - drag.origin.y;

      if (drag.mode === "move") {
        const [il, it, ir, ibot] = drag.initBox;
        const bw = ir - il;
        const bh = ibot - it;
        let nl = Math.max(0, Math.min(canvas.width - bw, il + dx));
        let nt = Math.max(0, Math.min(canvas.height - bh, it + dy));
        box = [nl, nt, nl + bw, nt + bh];
      } else if (drag.mode === "resize") {
        let [l, t, r, bot] = drag.initBox;
        const h = drag.handle;
        if (h.includes("w")) l = Math.max(0, Math.min(r - 10, l + dx));
        if (h.includes("e")) r = Math.min(canvas.width, Math.max(l + 10, r + dx));
        if (h.includes("n")) t = Math.max(0, Math.min(bot - 10, t + dy));
        if (h.includes("s")) bot = Math.min(canvas.height, Math.max(t + 10, bot + dy));
        box = [l, t, r, bot];
      } else if (drag.mode === "draw") {
        box = [
          Math.max(0, Math.min(drag.origin.x, p.x)),
          Math.max(0, Math.min(drag.origin.y, p.y)),
          Math.min(canvas.width, Math.max(drag.origin.x, p.x)),
          Math.min(canvas.height, Math.max(drag.origin.y, p.y))
        ];
      }
      draw();
    }

    function onPointerUp(event) {
      if (!drag) return;
      try { canvas.releasePointerCapture(event.pointerId); } catch(e) {}
      drag = null;
      if (box) {
        const nb = normBox(box);
        if (nb[2] - nb[0] > 8 && nb[3] - nb[1] > 8) {
          box = nb;
          setComponentValue({
            left: nb[0],
            top: nb[1],
            right: nb[2],
            bottom: nb[3],
            _ts: Date.now()
          });
        }
      }
      draw();
    }

    canvas.addEventListener("pointerdown", onPointerDown);
    canvas.addEventListener("pointermove", onPointerMove);
    canvas.addEventListener("pointerup", onPointerUp);
    canvas.addEventListener("pointercancel", onPointerUp);

    window.addEventListener("message", (event) => {
      const data = event.data;
      if (!data || data.type !== "streamlit:render") return;
      const args = data.args || {};
      color = args.color || color;
      canvas.width = Math.max(100, Math.round(args.width || 640));
      canvas.height = Math.max(80, Math.round(args.height || 400));
      if (args.image_data_url && args.image_data_url !== lastSrc) {
        lastSrc = args.image_data_url;
        img.onload = () => {
          draw();
          setFrameHeight(canvas.height + 26);
        };
        img.src = args.image_data_url;
      }
      if (!drag && args.box && args.box.length === 4) {
        box = normBox(args.box);
      }
      draw();
      setFrameHeight(canvas.height + 26);
    });

    sendMessage("streamlit:componentReady", { apiVersion: 1 });
    setFrameHeight(140);
  </script>
</body>
</html>
